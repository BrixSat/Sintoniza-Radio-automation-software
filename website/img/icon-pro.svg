<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Sintoniza Schedule: the app's tile, with a week calendar (breaks booked in its cells) instead of the microphone. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#262B36"/>
      <stop offset="1" stop-color="#111318"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C9CED8"/>
      <stop offset="0.45" stop-color="#F4F5F8"/>
      <stop offset="1" stop-color="#9AA1AF"/>
    </linearGradient>
  </defs>

  <!-- Background tile -->
  <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="104" fill="none" stroke="#3A4150" stroke-width="6"/>

  <!-- Calendar page with its red header -->
  <rect x="92" y="116" width="328" height="300" rx="34" fill="url(#page)"/>
  <path d="M92 150 A34 34 0 0 1 126 116 H386 A34 34 0 0 1 420 150 V196 H92 Z" fill="#E5484D"/>

  <!-- Rings -->
  <g stroke="#E7E9EE" stroke-width="20" stroke-linecap="round">
    <line x1="168" y1="88" x2="168" y2="146"/>
    <line x1="344" y1="88" x2="344" y2="146"/>
  </g>

  <!-- The week: four columns, three rows; booked cells highlighted -->
  <g fill="#B9BFCB">
    <rect x="122" y="222" width="55" height="40" rx="9"/>
    <rect x="264" y="222" width="55" height="40" rx="9"/>
    <rect x="335" y="222" width="55" height="40" rx="9"/>
    <rect x="122" y="282" width="55" height="40" rx="9"/>
    <rect x="193" y="282" width="55" height="40" rx="9"/>
    <rect x="335" y="282" width="55" height="40" rx="9"/>
    <rect x="193" y="342" width="55" height="40" rx="9"/>
    <rect x="264" y="342" width="55" height="40" rx="9"/>
  </g>
  <g fill="#3B82F6">
    <rect x="193" y="222" width="55" height="40" rx="9"/>
    <rect x="264" y="282" width="55" height="40" rx="9"/>
    <rect x="122" y="342" width="55" height="40" rx="9"/>
    <rect x="335" y="342" width="55" height="40" rx="9"/>
  </g>
</svg>
