<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Sintoniza Rec: the app's tile, with the recording light over the station's sound wave. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#262B36"/>
      <stop offset="1" stop-color="#111318"/>
    </linearGradient>
    <radialGradient id="light" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#FF7A7E"/>
      <stop offset="0.55" stop-color="#E5484D"/>
      <stop offset="1" stop-color="#9E1F24"/>
    </radialGradient>
  </defs>

  <!-- Background tile -->
  <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="104" fill="none" stroke="#3A4150" stroke-width="6"/>

  <!-- The sound wave, recorded: bars across the tile -->
  <g fill="#78A2F5" opacity="0.9">
    <rect x="70"  y="322" width="22" height="60"  rx="11"/>
    <rect x="108" y="296" width="22" height="112" rx="11"/>
    <rect x="146" y="312" width="22" height="80"  rx="11"/>
    <rect x="184" y="276" width="22" height="152" rx="11"/>
    <rect x="222" y="300" width="22" height="104" rx="11"/>
    <rect x="260" y="266" width="22" height="172" rx="11"/>
    <rect x="298" y="304" width="22" height="96"  rx="11"/>
    <rect x="336" y="282" width="22" height="140" rx="11"/>
    <rect x="374" y="314" width="22" height="76"  rx="11"/>
    <rect x="412" y="300" width="22" height="104" rx="11"/>
  </g>

  <!-- The recording light -->
  <circle cx="256" cy="176" r="96" fill="#E5484D" opacity="0.18"/>
  <circle cx="256" cy="176" r="70" fill="url(#light)"/>
  <circle cx="256" cy="176" r="70" fill="none" stroke="#FFB3B6" stroke-width="5" opacity="0.6"/>
</svg>
