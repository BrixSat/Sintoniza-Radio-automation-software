<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Sintoniza Import: the app's tile, with a folder of music and an arrow bringing it into the library. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#262B36"/>
      <stop offset="1" stop-color="#111318"/>
    </linearGradient>
    <linearGradient id="folder" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7C548"/>
      <stop offset="1" stop-color="#D99A1E"/>
    </linearGradient>
    <linearGradient id="back" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C98A17"/>
      <stop offset="1" stop-color="#A86F0F"/>
    </linearGradient>
  </defs>

  <!-- Background tile -->
  <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="104" fill="none" stroke="#3A4150" stroke-width="6"/>

  <!-- Folder: back with its tab, then the front -->
  <path d="M84 168 A26 26 0 0 1 110 142 H204 L236 174 H402 A26 26 0 0 1 428 200 V386 A26 26 0 0 1 402 412 H110 A26 26 0 0 1 84 386 Z" fill="url(#back)"/>
  <path d="M84 222 A26 26 0 0 1 110 196 H402 A26 26 0 0 1 428 222 V386 A26 26 0 0 1 402 412 H110 A26 26 0 0 1 84 386 Z" fill="url(#folder)"/>

  <!-- A note on the folder -->
  <g fill="#7A4E05">
    <path d="M206 250 L300 230 V350 A26 22 0 1 1 282 330 V268 L224 281 V362 A26 22 0 1 1 206 342 Z"/>
  </g>

  <!-- The arrow: into the library -->
  <circle cx="396" cy="384" r="70" fill="#3B82F6" stroke="#111318" stroke-width="12"/>
  <path d="M396 342 V412 M366 384 L396 414 L426 384" fill="none" stroke="#FFFFFF" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
