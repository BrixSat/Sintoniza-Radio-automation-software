<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111318">
<title>Sintoniza</title>
<style>
  :root { --bg:#111318; --panel:#1A1D24; --line:#2A2F3A; --text:#E7E9EE; --muted:#8B93A3; --accent:#3E8EDE; --onair:#E5484D; --next:#F5A524; --ok:#3ECF8E; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  header { display:flex; align-items:center; gap:10px; padding:12px 14px; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--bg); z-index:2; }
  header h1 { font-size:16px; margin:0; flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .clock { font-variant-numeric:tabular-nums; font-weight:600; }
  .lights { display:flex; gap:6px; }
  .light { font-size:11px; font-weight:700; letter-spacing:.06em; padding:3px 7px; border-radius:4px; background:#262A33; color:var(--muted); }
  .light.on { background:#1F4A34; color:#8FF0C0; } .light.bad { background:#5A2A2E; color:#FFB3B6; }
  main { padding:12px; max-width:760px; margin:0 auto; display:grid; gap:12px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px; }
  .badge { display:inline-block; font-size:11px; font-weight:800; letter-spacing:.08em; padding:3px 7px; border-radius:4px; background:#3A3F4B; }
  .badge.playing { background:var(--onair); } .badge.paused { background:var(--next); color:#111; }
  .title { font-size:22px; font-weight:700; margin:8px 0 2px; } .artist { color:var(--muted); }
  .bar { height:8px; background:#262A33; border-radius:4px; margin:12px 0 6px; overflow:hidden; } .bar > div { height:100%; background:var(--onair); width:0; }
  .times { display:flex; justify-content:space-between; font-variant-numeric:tabular-nums; } .times .left { font-size:26px; font-weight:700; }
  .transport { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
  button { font:inherit; color:var(--text); background:#262A33; border:1px solid var(--line); border-radius:8px; padding:12px 8px; cursor:pointer; }
  button:active { transform:scale(.97); } button.big { font-size:18px; font-weight:700; padding:16px 8px; }
  button.accent { background:var(--accent); border-color:var(--accent); } button.danger { background:#8E1F24; border-color:#8E1F24; }
  .row2 { display:flex; gap:8px; margin-top:8px; align-items:center; }
  .auto { flex:1; } .auto.on { background:#1F4A34; border-color:#2E7D55; color:#8FF0C0; font-weight:700; }
  .break { color:var(--next); font-weight:600; }
  h2 { font-size:12px; letter-spacing:.1em; color:var(--muted); margin:0 0 8px; text-transform:uppercase; }
  .item { display:grid; grid-template-columns:60px 1fr auto; gap:8px; align-items:center; padding:8px 0; border-top:1px solid var(--line); }
  .item:first-of-type { border-top:0; } .item .t { font-variant-numeric:tabular-nums; color:var(--muted); font-size:13px; }
  .item .n { overflow:hidden; } .item .n div { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; } .item .n small { color:var(--muted); }
  .item .acts { display:flex; gap:6px; } .item .acts button { padding:6px 9px; font-size:13px; }
  .tag { font-size:10px; font-weight:800; letter-spacing:.06em; padding:1px 5px; border-radius:3px; background:#2A3550; color:#AFC4F2; margin-left:6px; }
  .carts { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .cart { min-height:64px; text-align:left; font-weight:600; font-size:13px; display:flex; flex-direction:column; justify-content:space-between; }
  .cart small { color:#C9CFDA; font-weight:400; font-variant-numeric:tabular-nums; } .cart.playing { outline:2px solid #fff; }
  .cart.empty { opacity:.35; }
  input { font:inherit; width:100%; padding:11px 12px; border-radius:8px; border:1px solid var(--line); background:#0D0F13; color:var(--text); }
  #login { max-width:360px; margin:12vh auto; padding:0 16px; text-align:center; } #login .card { display:grid; gap:12px; }
  .msg { color:#FFB3B6; min-height:1.2em; font-size:13px; } .hidden { display:none !important; }
  #toast { position:fixed; left:50%; bottom:18px; transform:translateX(-50%); background:#262A33; border:1px solid var(--line); padding:10px 14px; border-radius:8px; opacity:0; transition:opacity .2s; max-width:90vw; }
  #toast.show { opacity:1; }
</style>
</head>
<body>
<template id="t-ask-advert">{{An advert is on air. Do it anyway?}}</template>
<template id="t-offline">{{Can't reach the playout.}}</template>
<template id="t-remove">{{Remove}}</template>
<template id="t-now">{{Now}}</template>
<template id="t-next">{{Next}}</template>
<template id="t-added">{{Added after the item on air.}}</template>
<template id="t-break">{{Next ad break}}</template>
<template id="t-nothing">{{Nothing on air}}</template>

<section id="login" class="hidden">
  <h1 style="font-size:20px">Sintoniza</h1>
  <div class="card">
    <input id="password" type="password" placeholder="{{Password}}" autocomplete="current-password">
    <button class="accent big" id="loginButton">{{Open the remote}}</button>
    <div class="msg" id="loginMsg"></div>
  </div>
</section>

<div id="app" class="hidden">
  <header>
    <h1 id="station">Sintoniza</h1>
    <div class="lights">
      <span class="light" id="lStream">STREAM</span>
      <span class="light" id="lSilence">{{SILENCE}}</span>
    </div>
    <span class="clock" id="clock"></span>
  </header>
  <main>
    <section class="card">
      <span class="badge" id="state">—</span>
      <div class="title" id="title">—</div>
      <div class="artist" id="artist"></div>
      <div class="bar"><div id="progress"></div></div>
      <div class="times"><span id="elapsed">0:00</span><span class="left" id="remaining">-0:00</span></div>
      <div class="row2"><span class="break" id="break"></span></div>
    </section>

    <section class="card">
      <div class="transport">
        <button class="big accent" data-cmd="play">▶</button>
        <button class="big" data-cmd="pause">❚❚</button>
        <button class="big" data-cmd="next">⏭</button>
        <button class="big danger" data-cmd="stop">■</button>
      </div>
      <div class="row2">
        <button class="auto" id="auto">AUTO</button>
      </div>
    </section>

    <section class="card">
      <h2>{{Coming up}}</h2>
      <div id="next"></div>
    </section>

    <section class="card">
      <h2 id="cartsTitle">{{Cartwall}}</h2>
      <div class="carts" id="carts"></div>
    </section>

    <section class="card">
      <h2>{{Add a song}}</h2>
      <input id="search" type="search" placeholder="{{Search the library: artist, title…}}">
      <div id="results"></div>
    </section>

    <div style="text-align:center"><button id="logout">{{Log out}}</button></div>
  </main>
</div>
<div id="toast"></div>

<script>
const $ = id => document.getElementById(id);
const t = id => document.getElementById("t-" + id).innerHTML.replace(/&amp;/g, "&").replace(/&#39;/g, "'").replace(/&quot;/g, '"').replace(/&lt;/g, "<").replace(/&gt;/g, ">");
const fmt = s => { s = Math.max(0, Math.round(s)); const m = Math.floor(s / 60); return m + ":" + String(s % 60).padStart(2, "0"); };
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
let timer = null, last = null;

function toast(text) { const e = $("toast"); e.textContent = text; e.classList.add("show"); clearTimeout(e.h); e.h = setTimeout(() => e.classList.remove("show"), 2500); }

async function api(path, body) {
  const r = await fetch(path, body === undefined ? { credentials: "same-origin" }
    : { method: "POST", credentials: "same-origin", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  if (r.status === 401 && path !== "/api/login") { showLogin(); throw new Error("login"); }
  return { status: r.status, data: await r.json().catch(() => ({})) };
}

function showLogin() { clearInterval(timer); timer = null; $("app").classList.add("hidden"); $("login").classList.remove("hidden"); $("password").focus(); }
function showApp() { $("login").classList.add("hidden"); $("app").classList.remove("hidden"); refresh(); if (!timer) timer = setInterval(refresh, 1000); }

$("loginButton").onclick = async () => {
  const r = await api("/api/login", { password: $("password").value });
  if (r.status === 200) { $("password").value = ""; $("loginMsg").textContent = ""; showApp(); }
  else $("loginMsg").textContent = r.data.error || "";
};
$("password").onkeydown = e => { if (e.key === "Enter") $("loginButton").click(); };
$("logout").onclick = async () => { await api("/api/logout", {}); showLogin(); };

async function command(c) {
  let r = await api("/api/command", c);
  if (r.data.confirm && confirm(r.data.confirm)) r = await api("/api/command", { ...c, force: true });
  if (r.data.message) toast(r.data.message);
  refresh();
}
document.querySelectorAll("[data-cmd]").forEach(b => b.onclick = () => command({ cmd: b.dataset.cmd }));
$("auto").onclick = () => command({ cmd: "auto", on: !(last && last.auto) });

async function refresh() {
  let r;
  try { r = await api("/api/status"); } catch (e) { if (e.message !== "login") toast(t("offline")); return; }
  const s = last = r.data;
  $("station").textContent = s.station || "Sintoniza";
  $("clock").textContent = s.clock || "";
  const st = $("state"); st.textContent = s.stateText; st.className = "badge " + s.state;
  $("title").textContent = s.onAir ? s.onAir.title : t("nothing");
  $("artist").textContent = s.onAir ? s.onAir.artist : "";
  $("progress").style.width = s.onAir && s.onAir.length > 0 ? (100 * s.onAir.position / s.onAir.length) + "%" : "0";
  $("elapsed").textContent = s.onAir ? fmt(s.onAir.position) : "0:00";
  $("remaining").textContent = s.onAir ? "-" + fmt(s.onAir.length - s.onAir.position) : "-0:00";
  $("break").textContent = s.nextBreak ? t("break") + ": " + s.nextBreak.at + " · " + s.nextBreak.name : "";
  $("auto").classList.toggle("on", s.auto); $("auto").textContent = s.auto ? "AUTO" : "ASSIST";
  $("lStream").className = "light " + (s.stream === "on" ? "on" : s.stream === "error" ? "bad" : "");
  $("lStream").classList.toggle("hidden", s.stream === "none");
  $("lSilence").className = "light " + (s.silence ? "bad" : "");
  $("next").innerHTML = (s.next || []).map(i => `<div class="item"><span class="t">${esc(i.start)}</span>
     <div class="n"><div>${esc(i.title)}${i.tag ? `<span class="tag">${esc(i.tag)}</span>` : ""}</div><small>${esc([i.artist, i.length].filter(x => x).join(" · "))}</small></div>
     <div class="acts">${i.id ? `<button data-now="${i.id}">${esc(t("now"))}</button>` : ""}${i.id && i.removable ? `<button data-remove="${i.id}">✕</button>` : ""}</div></div>`).join("");
  document.querySelectorAll("[data-now]").forEach(b => b.onclick = () => command({ cmd: "playnow", id: b.dataset.now }));
  document.querySelectorAll("[data-remove]").forEach(b => b.onclick = () => command({ cmd: "remove", id: b.dataset.remove }));
  $("cartsTitle").textContent = s.cartwall || "";
  $("carts").innerHTML = (s.carts || []).map((c, i) => `<button class="cart${c.playing ? " playing" : ""}${c.name ? "" : " empty"}" data-cart="${i}"
     style="${c.color ? "background:" + c.color : ""}"><span>${esc(c.name)}</span><small>${esc(c.time)}</small></button>`).join("");
  document.querySelectorAll("[data-cart]").forEach(b => b.onclick = () => command({ cmd: "cart", index: +b.dataset.cart }));
}

let searchTimer;
$("search").oninput = () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(async () => {
    const q = $("search").value.trim();
    if (q.length < 2) { $("results").innerHTML = ""; return; }
    const r = await api("/api/search?q=" + encodeURIComponent(q));
    $("results").innerHTML = (r.data.songs || []).map(x => `<div class="item"><span class="t">${esc(x.length)}</span>
       <div class="n"><div>${esc(x.title)}</div><small>${esc(x.artist)}</small></div>
       <div class="acts"><button data-add="${esc(x.path)}">+ ${esc(t("next"))}</button></div></div>`).join("");
    document.querySelectorAll("[data-add]").forEach(b => b.onclick = async () => { await command({ cmd: "add", path: b.dataset.add }); toast(t("added")); });
  }, 300);
};

api("/api/status").then(r => r.status === 200 ? showApp() : showLogin()).catch(() => {});
</script>
</body>
</html>
