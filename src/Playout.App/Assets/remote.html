<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111318">
<title>Sintoniza</title>
<style>
  /* The on-air program's look: same colours, panels, captions and badges. */
  :root { --bg:#111318; --panel:#1A1D24; --line:#2A2F3A; --text:#E7E9EE; --muted:#8B93A3; --accent:#4C8DFF; --onair:#E5484D; --next:#F5A524; --ok:#3ECF8E;
          --well:#13161C; --button:#2A2F3A; --button-line:#3A4150; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; background:var(--bg); color:var(--text); font:14px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  button { font:inherit; color:var(--text); background:var(--button); border:1px solid var(--button-line); border-radius:6px; padding:6px 10px; cursor:pointer; }
  button:hover { background:#333947; } button:active { transform:scale(.97); }
  input, select { font:inherit; color:var(--text); background:#0D0F13; border:1px solid var(--line); border-radius:6px; padding:8px 10px; }
  .hidden { display:none !important; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:14px; min-width:0; }
  .caption { font-size:11px; font-weight:600; letter-spacing:1.2px; color:var(--muted); text-transform:uppercase; }
  .muted { color:var(--muted); }
  .digits { font-variant-numeric:tabular-nums; }
  .badge { display:inline-flex; align-items:center; gap:7px; font-size:11px; font-weight:700; letter-spacing:1.5px; padding:3px 9px; border-radius:4px;
           background:#3A3F4B; white-space:nowrap; }
  .badge.playing { background:var(--onair); } .badge.paused { background:#A8700F; }
  .badge.stream { background:#2A2F3A; border:1px solid #3A4150; } .badge.stream i { width:7px; height:7px; border-radius:50%; background:var(--muted); }
  .badge.stream.on { background:#1F6F4A; border-color:#3ECF8E; } .badge.stream.on i { background:#3ECF8E; }
  .badge.stream.connecting { background:#6B4C10; border-color:#F5A524; } .badge.stream.connecting i { background:#F5A524; }
  .badge.stream.error { background:#6E2427; border-color:#E5484D; } .badge.stream.error i { background:#E5484D; }
  .badge.cue { font-size:13px; padding:2px 10px; color:#fff; } .badge.intro { background:#1F6F4A; } .badge.outro { background:#5B3F99; }
  .badge.silence { background:var(--onair); } .badge.break { background:#1F6F4A; } .badge.break.soon { background:var(--onair); }
  .mode { display:inline-flex; align-items:center; gap:7px; font-size:11px; font-weight:700; letter-spacing:1.5px; padding:5px 10px; border-radius:6px;
          background:#4A3510; border:1px solid var(--next); color:#FFD48A; }
  .mode.on { background:#174A33; border-color:var(--ok); color:#9CF0C8; }
  .mode svg { width:14px; height:14px; fill:currentColor; }

  /* Layout: deck | station on top, playlist | cartwall below, the status line at the bottom (as on screen). */
  #app { display:flex; flex-direction:column; gap:12px; padding:12px; height:100vh; height:100dvh; }
  #top { display:grid; gap:12px; grid-template-columns:minmax(0,1fr) 400px; }
  #body { display:grid; gap:12px; grid-template-columns:minmax(0,3fr) minmax(0,2fr); flex:1; min-height:0; }
  #body > .panel { min-height:0; overflow:hidden; }

  /* Deck */
  .deck-top { display:flex; align-items:center; gap:8px; }
  .deck-top .middle { flex:1; display:flex; justify-content:center; gap:8px; min-width:0; }
  .deck-top .middle .break { margin-left:auto; margin-right:10px; }
  #title { font-size:26px; font-weight:600; margin-top:6px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #artist { font-size:16px; color:var(--muted); margin-bottom:10px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-height:1.2em; }
  canvas { display:block; width:100%; }
  #wave { height:78px; border-radius:4px; } #overview { height:22px; margin-top:4px; border-radius:3px; }
  .transport-row { display:grid; grid-template-columns:1fr auto 1fr; align-items:center; margin-top:10px; gap:10px; }
  .time { font-size:30px; font-weight:600; }
  .transport { background:var(--well); border-radius:10px; padding:6px; display:flex; gap:6px; }
  .transport button { width:64px; height:50px; border-radius:6px; display:flex; align-items:center; justify-content:center; padding:0; }
  .transport svg { width:18px; height:18px; fill:var(--text); }
  .transport .play.active { background:#1F8A55; border-color:var(--ok); } .transport .pause.active { background:#A8700F; border-color:var(--next); }
  .transport .stop.active { background:#7A2427; border-color:var(--onair); }
  .transport.guarded button:not(.play) svg { opacity:.35; }
  .next-line { display:flex; gap:8px; align-items:center; margin-top:10px; min-width:0; }
  .next-line .caption { color:var(--next); } #nextTitle { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  /* Station */
  #station { display:flex; flex-direction:column; }
  .brand { display:grid; grid-template-columns:auto 1fr; gap:14px; align-items:center; }
  #logo { width:84px; height:84px; object-fit:contain; border-radius:8px; }
  .clock-box { text-align:center; min-width:0; }
  #clock { font-size:50px; font-weight:300; line-height:1.05; } #stationName { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .info { display:grid; grid-template-columns:1fr 1fr; gap:10px 12px; margin-top:12px; }
  .info .value { font-size:17px; font-weight:600; margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .info .wide { grid-column:1 / span 2; }
  .meters { margin-top:auto; padding-top:12px; display:grid; grid-template-columns:18px 1fr; gap:4px 0; align-items:center; }
  .meters canvas { height:12px; }

  /* Playlist */
  #list { display:flex; flex-direction:column; }
  .list-head { display:flex; align-items:center; gap:10px; margin-bottom:8px; }
  .cols, .row { display:grid; grid-template-columns:10px 36px 28px minmax(0,1fr) 70px 70px; align-items:center; }
  .cols, .row { column-gap:6px; } .cols { padding:0 8px 4px; } .cols .r, .row .r { text-align:right; }
  #rows { overflow:auto; flex:1; min-height:0; }
  .row { position:relative; height:40px; padding:0 8px; border-radius:4px; }
  .row .marker { width:4px; height:28px; border-radius:2px; } .row.playing .marker { background:var(--onair); height:36px; } .row.next .marker { background:var(--next); }
  .row.playing .t1 { color:#FF8A8D; font-weight:600; }
  .row .progress { position:absolute; left:0; top:0; bottom:0; background:#3A1E22; border-radius:4px; z-index:0; }
  .row > * { position:relative; z-index:1; }
  .row.preview { opacity:.8; } .row.preview .t1 { font-style:italic; } .row.over { opacity:.5; }
  .row .names { min-width:0; } .row .t1line { display:flex; gap:6px; align-items:center; min-width:0; }
  .row .t1 { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; } .row .t2 { font-size:12px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .kind svg { width:15px; height:15px; } .row.playing .kind svg { width:18px; height:18px; }
  .kind .currency { font-weight:700; font-size:15px; color:var(--ok); } .row.playing .kind .currency { font-size:18px; }
  .t1line .tags { margin-left:auto; display:flex; gap:6px; align-items:center; flex:none; }
  .tags svg { width:10px; height:11px; fill:#AFC4F2; }
  .tag { flex:none; font-size:9px; font-weight:700; letter-spacing:1px; padding:0 4px; border-radius:3px; }
  .tag.event { background:#2A3550; color:#AFC4F2; } .tag.preview { border:1px solid var(--next); color:var(--next); } .tag.over { background:#5A2A2E; color:#FFB3B6; }
  .tag.cue { border:1px solid #4A5263; color:var(--muted); }
  .hour { display:flex; align-items:center; margin:2px 8px 7px; } .hour span { font-size:11px; font-weight:700; letter-spacing:1px; background:#2A2F3A; color:#C9CFDA;
          padding:1px 6px; border-radius:3px; } .hour i { flex:1; height:1px; background:#4A5263; margin-left:8px; }
  .acts { position:absolute; right:150px; top:50%; transform:translateY(-50%); display:none; gap:6px; z-index:2; }
  .acts button { padding:3px 9px; font-size:12px; }
  .row:hover .acts, .row.open .acts { display:flex; }

  /* Cartwall / library */
  #side { display:flex; flex-direction:column; }
  .tabs { display:flex; align-items:center; gap:4px; margin-bottom:8px; }
  .tab { background:transparent; border:0; color:var(--muted); font-size:11px; font-weight:600; letter-spacing:1.2px; padding:4px 8px; border-radius:4px; }
  .tab.on { background:#2A2F3A; color:#fff; }
  .tabs select { margin-left:auto; padding:4px 8px; max-width:50%; }
  #carts { display:grid; grid-template-columns:repeat(3,1fr); grid-auto-rows:minmax(58px,1fr); gap:6px; flex:1; min-height:0; }
  .cart { position:relative; text-align:left; background:#252A34; border:1px solid #323846; border-radius:6px; padding:8px 10px; display:flex;
          flex-direction:column; justify-content:space-between; overflow:hidden; min-height:58px; }
  .cart.empty { background:#1C1F26; } .cart.playing { background:#B8353A; border-color:var(--onair); } .cart.colored.playing { border:2px solid #fff; }
  .cart b svg { width:14px; height:14px; fill:currentColor; vertical-align:-2px; margin-right:6px; }
  .cart b { font-weight:600; font-size:13px; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
  .cart .foot { display:flex; justify-content:space-between; font-size:11px; color:#C9CFDA; } .cart.empty .foot { color:#5A6070; }
  .side-note { font-size:11px; color:var(--muted); margin-top:8px; }
  #library { display:flex; flex-direction:column; flex:1; min-height:0; } #search { width:100%; } #results { overflow:auto; flex:1; margin-top:8px; }
  .song { display:grid; grid-template-columns:minmax(0,1fr) auto auto; gap:10px; align-items:center; padding:6px 8px; border-radius:4px; }
  .song:hover { background:#20242C; } .song .t2 { font-size:12px; color:var(--muted); }

  /* Status line */
  #status { display:flex; align-items:center; gap:8px; } #lastLog { margin-left:auto; font-size:12px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #status button { display:inline-flex; align-items:center; gap:6px; font-size:13px; } #status svg { width:10px; height:12px; fill:currentColor; }

  /* A phone: one column, the page scrolls. */
  @media (max-width:1099px) {
    #app { height:auto; padding:8px; gap:8px; }
    #top, #body { display:flex; flex-direction:column; gap:8px; } .brand { grid-template-columns:auto 1fr; } #logo { width:48px; height:48px; } #clock { font-size:34px; }
    .info { grid-template-columns:repeat(3,1fr); } .info .wide { grid-column:1 / span 3; }
    #title { font-size:21px; } .time { font-size:22px; }
    .transport-row { grid-template-columns:1fr 1fr; } .transport { grid-column:1 / span 2; grid-row:2; justify-content:center; }
    .transport button { flex:1; width:auto; height:56px; }
    #rows { max-height:none; } .cols, .row { grid-template-columns:6px 24px 22px minmax(0,1fr) 64px 44px; }
    .row { height:auto; min-height:40px; padding-top:4px; padding-bottom:4px; } .row .r { font-size:12px; }
    .t1line { flex-wrap:wrap; } .t1line .t1 { flex:1 1 100%; } .t1line .tags { margin-left:0; order:3; flex:1 1 100%; flex-wrap:wrap; min-width:0; }
    .t1line .tags:empty { display:none; } .cols .caption { letter-spacing:.4px; } .cols, .row { column-gap:4px; }
    .acts { right:110px; } .row .acts { display:flex; } .row:not(.open) .acts { display:none; }
    #carts { grid-auto-rows:64px; } #status { flex-wrap:wrap; } #lastLog { width:100%; order:2; margin-left:0; }
  }

  /* Log-in */
  #login { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:16px; }
  #login .panel { width:100%; max-width:440px; padding:26px; display:grid; gap:14px; }
  #login .head { display:grid; grid-template-columns:auto 1fr; gap:12px; align-items:center; }
  #login .head svg { width:44px; height:44px; } #login h1 { font-size:18px; margin:0; }
  #login label { display:grid; gap:4px; font-size:12px; color:var(--muted); } #login input { width:100%; }
  #login .buttons { display:flex; justify-content:flex-end; } .accent { background:var(--accent); border-color:var(--accent); min-width:90px; }
  .msg { color:#FFB3B6; font-size:12px; min-height:1em; }
  #toast { position:fixed; left:50%; bottom:18px; transform:translateX(-50%); background:#262A33; border:1px solid var(--line); padding:10px 14px; border-radius:8px;
           opacity:0; transition:opacity .2s; max-width:90vw; pointer-events:none; z-index:9; }
  #toast.show { opacity:1; }
</style>
</head>
<body>
<template id="t-ask-advert">{{An advert is on air. Do it anyway?}}</template>
<template id="t-offline">{{Can't reach the playout.}}</template>
<template id="t-remove">{{Remove}}</template>
<template id="t-now">{{Now}}</template>
<template id="t-next">{{Next}}</template>
<template id="t-added">{{Added after the item on air.}}</template>
<template id="t-nothing">{{Nothing on air}}</template>
<template id="t-auto">{{AUTO}}</template>
<template id="t-assisted">{{ASSISTED}}</template>
<template id="t-breakin">{{BREAK IN}}</template>
<template id="t-silence">{{SILENCE}}</template>

<svg width="0" height="0" style="position:absolute">
  <symbol id="i-play" viewBox="0 0 11 14"><path d="M0,0 L11,7 L0,14 Z"/></symbol>
  <symbol id="i-pause" viewBox="0 0 11 14"><path d="M0,0 H4 V14 H0 Z M7,0 H11 V14 H7 Z"/></symbol>
  <symbol id="i-next" viewBox="0 0 12 14"><path d="M0,0 L8,7 L0,14 Z M9,0 H12 V14 H9 Z"/></symbol>
  <symbol id="i-stop" viewBox="0 0 12 12"><path d="M0,0 H12 V12 H0 Z"/></symbol>
  <symbol id="i-auto" viewBox="0 0 16 16"><path d="M8,2 A6,6 0 1 1 2.6,5.4 L4.4,6.3 A4,4 0 1 0 8,4 Z M7.5,0 L11,3 L7.5,6 Z"/></symbol>
  <symbol id="i-assisted" viewBox="0 0 16 16"><path d="M5,4 A3,3 0 1 0 11,4 A3,3 0 1 0 5,4 Z M2,15.5 C2,11 4.7,9 8,9 C11.3,9 14,11 14,15.5 Z"/></symbol>
  <symbol id="i-music" viewBox="0 0 16 16"><path fill="#78A2F5" d="M5.5,2.2 L15,0 V11.3 A2.6,2.2 0 1 1 13.4,9.3 V3.4 L7.1,4.9 V13.3 A2.6,2.2 0 1 1 5.5,11.3 Z"/></symbol>
  <symbol id="i-jingle" viewBox="0 0 16 16"><path fill="#F5A524" d="M8,0 L9.9,6.1 L16,8 L9.9,9.9 L8,16 L6.1,9.9 L0,8 L6.1,6.1 Z"/></symbol>
  <symbol id="i-mic" viewBox="0 0 16 16"><path fill="#E8B04B" d="M8,0 A3,3 0 0 1 11,3 V8 A3,3 0 0 1 5,8 V3 A3,3 0 0 1 8,0 Z M2.5,7 H4 A4,4 0 0 0 12,7 H13.5 A5.5,5.5 0 0 1 8.75,12.45 V14.5 H11 V16 H5 V14.5 H7.25 V12.45 A5.5,5.5 0 0 1 2.5,7 Z"/></symbol>
  <symbol id="i-stream" viewBox="0 0 16 16"><path fill="#B392F0" d="M8,6.4 A1.6,1.6 0 1 1 8,9.6 A1.6,1.6 0 1 1 8,6.4 Z M4.11,4.11 L5.17,5.17 A4,4 0 0 0 5.17,10.83 L4.11,11.89 A5.5,5.5 0 0 1 4.11,4.11 Z M11.89,4.11 A5.5,5.5 0 0 1 11.89,11.89 L10.83,10.83 A4,4 0 0 0 10.83,5.17 Z M2.34,2.34 L3.4,3.4 A6.5,6.5 0 0 0 3.4,12.6 L2.34,13.66 A8,8 0 0 1 2.34,2.34 Z M13.66,2.34 A8,8 0 0 1 13.66,13.66 L12.6,12.6 A6.5,6.5 0 0 0 12.6,3.4 Z"/></symbol>
  <symbol id="i-lock" viewBox="0 0 16 18"><path d="M2,7 V5 A6,6 0 0 1 14,5 V7 H16 V18 H0 V7 Z M5,7 H11 V5 A3,3 0 0 0 5,5 Z"/></symbol>
  <symbol id="i-logo" viewBox="0 0 44 44"><rect width="44" height="44" rx="9" fill="#1A1D24" stroke="#2A2F3A"/><g transform="translate(14,10) scale(1)"><path fill="#E7E9EE" d="M8,0 A4,4 0 0 1 12,4 V12 A4,4 0 0 1 4,12 V4 A4,4 0 0 1 8,0 Z M1,11 H3 A5,5 0 0 0 13,11 H15 A7,7 0 0 1 9,17.9 V21 H12 V23 H4 V21 H7 V17.9 A7,7 0 0 1 1,11 Z"/></g><path d="M8,14 A16,16 0 0 0 8,30 M36,14 A16,16 0 0 1 36,30" stroke="#E5484D" stroke-width="2.4" fill="none" stroke-linecap="round"/></symbol>
</svg>

<section id="login" class="hidden">
  <div class="panel">
    <div class="head"><svg><use href="#i-logo"/></svg><div><h1>Sintoniza Emi</h1><div class="muted" id="loginStation" style="font-size:12px"></div></div></div>
    <label>{{User}}<input id="user" type="text" autocomplete="username" autocapitalize="none"></label>
    <label>{{Password}}<input id="password" type="password" autocomplete="current-password"></label>
    <div class="msg" id="loginMsg"></div>
    <div class="buttons"><button class="accent" id="loginButton">{{Log in}}</button></div>
  </div>
</section>

<div id="app" class="hidden">
  <div id="top">
  <!-- ═════════ The deck ═════════ -->
  <section class="panel" id="deck">
    <div class="deck-top">
      <span class="badge" id="state">—</span>
      <span class="badge stream hidden" id="stream"><i></i><span id="streamText"></span></span>
      <div class="middle">
        <span class="badge cue intro hidden" id="cue"></span>
        <span class="badge cue silence hidden" id="silence"></span>
        <span class="badge cue break hidden" id="breakIn"></span>
      </div>
      <button class="mode" id="auto"><svg><use href="#i-auto"/></svg><span>AUTO</span></button>
    </div>
    <div id="title">—</div>
    <div id="artist"></div>
    <canvas id="wave"></canvas>
    <canvas id="overview"></canvas>
    <div class="transport-row">
      <div><div class="caption">{{ELAPSED}}</div><div class="time digits" id="elapsed">00:00</div></div>
      <div class="transport" id="transport">
        <button class="play" data-cmd="play" title="Play"><svg><use href="#i-play"/></svg></button>
        <button class="pause" data-cmd="pause"><svg><use href="#i-pause"/></svg></button>
        <button class="next" data-cmd="next"><svg><use href="#i-next"/></svg></button>
        <button class="stop" data-cmd="stop"><svg><use href="#i-stop"/></svg></button>
      </div>
      <div style="text-align:right"><div class="caption">{{REMAINING}}</div><div class="time digits" id="remaining">-00:00</div></div>
    </div>
    <div class="next-line"><span class="caption">{{NEXT}}</span><span id="nextTitle">—</span></div>
  </section>

  <!-- ═════════ The station ═════════ -->
  <section class="panel" id="station">
    <div class="brand">
      <img id="logo" class="hidden" alt="">
      <div class="clock-box">
        <div class="caption" id="stationName"></div>
        <div class="digits" id="clock">00:00:00</div>
        <div class="muted" id="date"></div>
      </div>
    </div>
    <div class="info">
      <div><div class="caption">{{TOP OF HOUR}}</div><div class="value digits" id="topOfHour">—</div></div>
      <div><div class="caption">{{PLAYLIST ENDS}}</div><div class="value digits" id="playlistEnds">—</div></div>
      <div><div class="caption">{{PLAYED TODAY}}</div><div class="value digits" id="playedToday">0</div></div>
      <div id="streamTimeBox" class="hidden"><div class="caption">{{STREAM TIME}}</div><div class="value digits" id="streamTime"></div></div>
      <div id="nextEventBox" class="wide hidden"><div class="caption">{{NEXT EVENT}}</div><div class="value" id="nextEvent"></div></div>
    </div>
    <div class="meters">
      <span class="caption">{{L}}</span><canvas id="meterL"></canvas>
      <span class="caption">{{R}}</span><canvas id="meterR"></canvas>
    </div>
  </section>
  </div>

  <div id="body">
  <!-- ═════════ The playlist ═════════ -->
  <section class="panel" id="list">
    <div class="list-head"><span class="caption">{{PLAYLIST}}</span><span class="muted" id="playlistInfo" style="font-size:12px"></span></div>
    <div class="cols"><span></span><span class="caption">#</span><span></span><span class="caption">{{TITLE}}</span><span class="caption r">{{START}}</span><span class="caption r">{{LENGTH}}</span></div>
    <div id="rows"></div>
  </section>

  <!-- ═════════ Cartwall / library ═════════ -->
  <section class="panel" id="side">
    <div class="tabs">
      <button class="tab on" data-tab="carts">{{CARTWALL}}</button>
      <button class="tab" data-tab="library">{{LIBRARY}}</button>
      <select id="cartwall"></select>
    </div>
    <div id="carts"></div>
    <div id="library" class="hidden">
      <input id="search" type="search" placeholder="{{Search the library: artist, title…}}">
      <div id="results"></div>
    </div>
  </section>
  </div>

  <!-- ═════════ Status line ═════════ -->
  <footer id="status">
    <button id="logout"><svg><use href="#i-lock"/></svg>{{Log out}}</button>
    <span id="lastLog"></span>
  </footer>
</div>
<div id="toast"></div>

<script>
const $ = id => document.getElementById(id);
const t = id => document.getElementById("t-" + id).innerHTML.replace(/&amp;/g, "&").replace(/&#39;/g, "'").replace(/&quot;/g, '"').replace(/&lt;/g, "<").replace(/&gt;/g, ">");
const two = n => String(n).padStart(2, "0");
const fmt = s => { s = Math.max(0, Math.floor(s)); return two(Math.floor(s / 60)) + ":" + two(s % 60); };
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
let timer = null, levelTimer = null, last = null, openRow = null;

function toast(text) { const e = $("toast"); e.textContent = text; e.classList.add("show"); clearTimeout(e.h); e.h = setTimeout(() => e.classList.remove("show"), 2500); }

async function api(path, body) {
  const r = await fetch(path, body === undefined ? { credentials: "same-origin" }
    : { method: "POST", credentials: "same-origin", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  if (r.status === 401 && path !== "/api/login") { showLogin(); throw new Error("login"); }
  return { status: r.status, data: await r.json().catch(() => ({})) };
}

// ───────────── Log-in ─────────────
function showLogin() {
  clearInterval(timer); clearInterval(levelTimer); timer = levelTimer = null;
  $("app").classList.add("hidden"); $("login").classList.remove("hidden");
  $("user").value = $("user").value || localStorage.getItem("sintonizaUser") || "";
  ($("user").value ? $("password") : $("user")).focus();
}
function showApp() {
  $("login").classList.add("hidden"); $("app").classList.remove("hidden");
  refresh(); if (!timer) timer = setInterval(refresh, 1000);
  if (!levelTimer) levelTimer = setInterval(levels, 120);
}
$("loginButton").onclick = async () => {
  const r = await api("/api/login", { user: $("user").value.trim(), password: $("password").value });
  if (r.status === 200) { localStorage.setItem("sintonizaUser", $("user").value.trim()); $("password").value = ""; $("loginMsg").textContent = ""; showApp(); }
  else $("loginMsg").textContent = r.data.error || "";
};
$("password").onkeydown = e => { if (e.key === "Enter") $("loginButton").click(); };
$("user").onkeydown = e => { if (e.key === "Enter") $("password").focus(); };
$("logout").onclick = async () => { await api("/api/logout", {}); showLogin(); };

// ───────────── Commands ─────────────
async function command(c) {
  let r = await api("/api/command", c);
  if (r.data.confirm && confirm(r.data.confirm)) r = await api("/api/command", { ...c, force: true });
  if (r.data.message) toast(r.data.message);
  refresh();
}
document.querySelectorAll("[data-cmd]").forEach(b => b.onclick = () => command({ cmd: b.dataset.cmd }));
$("auto").onclick = () => command({ cmd: "auto", on: !(last && last.auto) });
$("cartwall").onchange = () => command({ cmd: "cartwall", name: $("cartwall").value });
document.querySelectorAll(".tab").forEach(b => b.onclick = () => {
  document.querySelectorAll(".tab").forEach(x => x.classList.toggle("on", x === b));
  $("carts").classList.toggle("hidden", b.dataset.tab !== "carts");
  $("cartwall").classList.toggle("hidden", b.dataset.tab !== "carts");
  $("library").classList.toggle("hidden", b.dataset.tab !== "library");
  if (b.dataset.tab === "library") $("search").focus();
});

// ───────────── What is on air (every second) ─────────────
const kindIcon = (k, currency) => k === "commercial" ? `<span class="currency">${esc(currency)}</span>`
  : `<svg><use href="#i-${k === "music" ? "music" : k === "jingle" ? "jingle" : k === "stream" ? "stream" : "mic"}"/></svg>`;
const rowBg = (i, c) => !c ? "" : i.playing ? c.OnAirRowBg : i.adBreak ? c.BreakRowBg : i.kind === "jingle" ? c.JingleRowBg
  : i.kind === "stream" ? c.StreamRowBg : i.kind === "programme" || i.kind === "voice" ? c.ProgrammeRowBg : c.MusicRowBg;

async function refresh() {
  let r;
  try { r = await api("/api/status"); } catch (e) { if (e.message !== "login") toast(t("offline")); return; }
  const s = last = r.data;
  document.title = (s.station || "Sintoniza") + " — Sintoniza";
  $("stationName").textContent = s.station || "";
  $("loginStation").textContent = s.station || "";
  $("clock").textContent = s.clock || "";
  $("date").textContent = s.date || "";
  $("topOfHour").textContent = s.topOfHour || "—";
  $("playlistEnds").textContent = s.playlistEnds || "—";
  $("playedToday").textContent = s.playedToday || "0";
  $("streamTimeBox").classList.toggle("hidden", !s.streamTime); $("streamTime").textContent = s.streamTime || "";
  $("nextEventBox").classList.toggle("hidden", !s.nextEvent); $("nextEvent").textContent = s.nextEvent || "";
  if (s.logo && $("logo").classList.contains("hidden")) { $("logo").src = "/api/logo"; $("logo").classList.remove("hidden"); }
  if (!s.logo) $("logo").classList.add("hidden");

  const st = $("state"); st.textContent = s.stateText; st.className = "badge " + s.state;
  $("stream").classList.toggle("hidden", s.stream === "none");
  $("stream").className = "badge stream " + (s.stream === "none" ? "hidden " : "") + s.stream; $("streamText").textContent = s.streamText || "";
  $("cue").classList.toggle("hidden", !s.cue);
  if (s.cue) { $("cue").textContent = s.cue.label + "  " + s.cue.time; $("cue").className = "badge cue " + (/outro/i.test(s.cue.label) ? "outro" : "intro"); }
  $("silence").classList.toggle("hidden", !s.silenceTime); $("silence").textContent = t("silence") + "  " + (s.silenceTime || "");
  $("breakIn").classList.toggle("hidden", !s.breakIn);
  if (s.breakIn) $("breakIn").textContent = `${s.currency}  ${t("breakin")}  ${s.breakIn.time} ${s.breakIn.how || ""}`;
  $("auto").classList.toggle("on", s.auto);
  $("auto").innerHTML = `<svg><use href="#i-${s.auto ? "auto" : "assisted"}"/></svg><span>${esc(s.auto ? t("auto") : t("assisted"))}</span>`;
  ["play", "pause", "stop"].forEach(k => document.querySelector(".transport ." + k).classList.toggle("active",
    k === "play" ? s.state === "playing" : k === "pause" ? s.state === "paused" : s.state === "stopped"));
  $("transport").classList.toggle("guarded", !!(s.onAir && s.onAir.advert));
  $("title").textContent = s.onAir ? s.onAir.title : t("nothing");
  $("artist").textContent = s.onAir ? s.onAir.artist : "";
  $("nextTitle").textContent = s.nextTitle || "—";
  $("playlistInfo").textContent = s.playlistInfo || "";
  $("lastLog").textContent = s.lastLog || "";

  // The playlist: as the rows on screen
  const c = s.rowColors;
  $("rows").innerHTML = (s.next || []).map(i => `${i.hourMark ? `<div class="hour"><span>${esc(i.hourMark)}</span><i></i></div>` : ""}
    <div class="row${i.playing ? " playing" : ""}${i.next ? " next" : ""}${i.preview ? " preview" : ""}${i.overHour ? " over" : ""}${openRow && openRow === i.id ? " open" : ""}"
         data-id="${esc(i.id || "")}" style="background:${rowBg(i, c)}">
      ${i.playing ? `<div class="progress" id="rowProgress"></div>` : ""}
      <span class="marker"></span>
      <span class="muted digits">${esc(i.number)}</span>
      <span class="kind">${kindIcon(i.kind, s.currency)}</span>
      <div class="names"><div class="t1line"><span class="t1">${esc(i.title)}</span><span class="tags">${i.eventTag ? `<span class="tag event">${esc(i.eventTag)}</span>` : ""}${
          i.overHour ? `<span class="tag over">${esc(s.words.wontPlay)}</span>` : ""}${i.locked ? `<svg viewBox="0 0 16 18"><use href="#i-lock"/></svg>` : ""}${
          i.preview ? `<span class="tag preview">${esc(s.words.scheduled)}</span>` : ""}${i.cues ? `<span class="tag cue">${esc(s.words.cue)}</span>` : ""}</span></div>
        ${i.artist ? `<div class="t2">${esc(i.artist)}</div>` : ""}</div>
      <span class="muted digits r">${esc(i.start)}</span>
      <span class="digits r">${esc(i.length)}</span>
      ${i.id && !i.playing ? `<span class="acts"><button data-now="${i.id}">▶ ${esc(t("now"))}</button>${i.removable ? `<button data-remove="${i.id}">✕</button>` : ""}</span>` : ""}
    </div>`).join("");
  document.querySelectorAll(".row[data-id]").forEach(row => row.onclick = e => {
    if (e.target.closest("button")) return;
    openRow = openRow === row.dataset.id ? null : row.dataset.id;
    document.querySelectorAll(".row").forEach(x => x.classList.toggle("open", !!openRow && x.dataset.id === openRow));
  });
  document.querySelectorAll("[data-now]").forEach(b => b.onclick = () => command({ cmd: "playnow", id: b.dataset.now }));
  document.querySelectorAll("[data-remove]").forEach(b => b.onclick = () => command({ cmd: "remove", id: b.dataset.remove }));

  // The cartwall
  const pick = $("cartwall");
  if (pick.dataset.names !== JSON.stringify(s.cartwalls)) {
    pick.innerHTML = (s.cartwalls || []).map(n => `<option>${esc(n)}</option>`).join(""); pick.dataset.names = JSON.stringify(s.cartwalls);
  }
  if (document.activeElement !== pick) pick.value = s.cartwall;
  $("carts").innerHTML = (s.carts || []).map((x, i) => `<button class="cart${x.playing ? " playing" : ""}${x.name ? "" : " empty"}${x.color ? " colored" : ""}" data-cart="${i}"
     style="${x.color && !x.playing ? "background:" + esc(x.color) + ";border-color:" + esc(x.color) : ""}"><b>${x.icon ? `<svg viewBox="0 0 16 16"><path d="${esc(x.icon)}"/></svg>` : ""}${esc(x.name)}</b>
     <span class="foot"><span>${i + 1}</span><span class="digits">${esc(x.time)}</span></span></button>`).join("");
  document.querySelectorAll("[data-cart]").forEach(b => b.onclick = () => command({ cmd: "cart", index: +b.dataset.cart }));
}

// ───────────── Levels, waveform (several times a second) ─────────────
let pos = { id: null, position: 0, length: 0, playing: false, at: performance.now() }, wave = null, waveFor = null, waveAsked = null;
let level = { l: -60, r: -60, pl: -60, pr: -60, plAt: 0, prAt: 0, at: performance.now() };
async function levels() {
  if (document.hidden) return;
  let r;
  try { r = await api("/api/levels"); } catch { return; }
  const v = r.data, now = performance.now();
  pos = { id: v.id, position: v.position, length: v.length, playing: v.playing, at: now };
  push("l", v.l, now); push("r", v.r, now);
  if (v.id && v.id !== waveFor && v.id !== waveAsked) {
    waveAsked = v.id;
    api("/api/waveform").then(w => { if (w.data && w.data.id) { wave = w.data; waveFor = w.data.id; } else waveAsked = null; }).catch(() => { waveAsked = null; });
  }
  if (!v.id) { wave = null; waveFor = null; }
}
// As the meters on screen: -60..0 dB, falling 26 dB a second, peak held 1.5 s
function push(side, linear, now) {
  const db = linear > 0 ? Math.max(-60, 20 * Math.log10(linear)) : -60;
  const dt = (now - level.at) / 1000;
  level[side] = db >= level[side] ? db : Math.max(db, level[side] - 26 * dt);
  const pk = "p" + side;
  if (db >= level[pk] || now - level[pk + "At"] > 1500) { level[pk] = db; level[pk + "At"] = now; }
  if (side === "r") level.at = now;
}

function canvas(id) {
  const c = $(id), r = c.getBoundingClientRect(), d = window.devicePixelRatio || 1;
  if (c.width !== Math.round(r.width * d) || c.height !== Math.round(r.height * d)) { c.width = Math.round(r.width * d); c.height = Math.round(r.height * d); }
  const g = c.getContext("2d"); g.setTransform(d, 0, 0, d, 0, 0); return [g, r.width, r.height];
}
function drawMeter(id, db, peak) {
  const [g, w, h] = canvas(id), n = 40, gap = 2, sw = (w - gap * (n - 1)) / n;
  const lit = Math.round((db + 60) / 60 * n), pk = Math.round((peak + 60) / 60 * n) - 1;
  for (let i = 0; i < n; i++) {
    const segDb = -60 + (i + 1) * 60 / n, on = segDb > -3 ? "#E5484D" : segDb > -12 ? "#F5C524" : "#3ECF8E";
    g.fillStyle = i < lit || i === pk ? on : "#262A33"; g.fillRect(i * (sw + gap), 0, sw, h);
  }
}
function now() { return pos.playing ? pos.position + (performance.now() - pos.at) / 1000 : pos.position; }
function drawWave() {
  const p = Math.min(now(), pos.length || 0), w2 = wave && wave.id === pos.id ? wave : null;
  // Scrolling: 12 seconds, the playhead a quarter of the way in; played red, still to play blue (peak dim, loudness bright)
  let [g, w, h] = canvas("wave");
  g.fillStyle = "#13161C"; g.fillRect(0, 0, w, h);
  g.fillStyle = "#262B35"; g.fillRect(0, h / 2, w, 1);
  const pxs = w / 12, head = Math.round(w * 0.25), mid = h / 2;
  if (w2) {
    const pps = w2.pointsPerSecond, step = 3, bar = 2;
    for (let x = 0; x < w; x += step) {
      const sec = p + (x - head) / pxs; if (sec < 0) continue;
      const i = Math.floor(sec * pps); if (i >= w2.peak.length) break;
      const played = x < head, pk = w2.peak[i] * (mid - 2), rm = w2.rms[i] * (mid - 2);
      g.fillStyle = played ? "#4A2428" : "#34507F"; g.fillRect(x, mid - pk, bar, pk * 2);
      g.fillStyle = played ? "#B9464B" : "#78A2F5"; g.fillRect(x, mid - rm, bar, rm * 2);
    }
  }
  if (pos.id) { g.fillStyle = "#fff"; g.fillRect(head, 0, 2, h); }
  // Overview: the whole item, played part red
  [g, w, h] = canvas("overview");
  g.fillStyle = "#13161C"; g.fillRect(0, 0, w, h);
  if (w2 && pos.length > 0) {
    const n = w2.peak.length, step = 2, bar = 1.5, at = p / pos.length * w;
    for (let x = 0; x < w; x += step) {
      let m = 0; const a = Math.floor(x / w * n), b = Math.max(a + 1, Math.floor((x + step) / w * n));
      for (let i = a; i < b && i < n; i++) m = Math.max(m, w2.peak[i]);
      const hh = Math.max(1, m * (h - 2));
      g.fillStyle = x < at ? "#E5484D" : "#4A5263"; g.fillRect(x, (h - hh) / 2, bar, hh);
    }
    g.fillStyle = "#fff"; g.fillRect(at, 0, 1.5, h);
  }
}
function frame() {
  if (!$("app").classList.contains("hidden")) {
    drawWave();
    const dt = (performance.now() - level.at) / 1000;
    drawMeter("meterL", Math.max(-60, level.l - 26 * Math.max(0, dt - 0.15)), level.pl);
    drawMeter("meterR", Math.max(-60, level.r - 26 * Math.max(0, dt - 0.15)), level.pr);
    const p = now(), len = pos.length || 0;
    if (pos.id) { $("elapsed").textContent = fmt(p); $("remaining").textContent = "-" + fmt(len - p); }
    else { $("elapsed").textContent = "00:00"; $("remaining").textContent = "-00:00"; }
    const bar = $("rowProgress"); if (bar && len > 0) bar.style.width = Math.min(100, 100 * p / len) + "%";
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ───────────── Library: add a song after the item on air ─────────────
let searchTimer;
$("search").oninput = () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(async () => {
    const q = $("search").value.trim();
    if (q.length < 2) { $("results").innerHTML = ""; return; }
    const r = await api("/api/search?q=" + encodeURIComponent(q));
    $("results").innerHTML = (r.data.songs || []).map(x => `<div class="song"><div style="min-width:0"><div>${esc(x.title)}</div><div class="t2">${esc(x.artist)}</div></div>
       <span class="muted digits">${esc(x.length)}</span><button data-add="${esc(x.path)}">+ ${esc(t("next"))}</button></div>`).join("");
    document.querySelectorAll("[data-add]").forEach(b => b.onclick = async () => { await command({ cmd: "add", path: b.dataset.add }); toast(t("added")); });
  }, 300);
};

api("/api/status").then(r => r.status === 200 ? showApp() : showLogin()).catch(() => showLogin());
</script>
</body>
</html>
