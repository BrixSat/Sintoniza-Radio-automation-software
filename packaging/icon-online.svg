<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Sintoniza Online: the app's tile, with the station's sound wave sent out as a signal. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#262B36"/>
      <stop offset="1" stop-color="#111318"/>
    </linearGradient>
    <radialGradient id="light" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#8FF0BE"/>
      <stop offset="0.55" stop-color="#34C47C"/>
      <stop offset="1" stop-color="#1B7A4B"/>
    </radialGradient>
  </defs>

  <!-- Background tile -->
  <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="104" fill="none" stroke="#3A4150" stroke-width="6"/>

  <!-- The sound wave: bars across the tile -->
  <g fill="#78A2F5" opacity="0.9">
    <rect x="70"  y="342" width="22" height="60"  rx="11"/>
    <rect x="108" y="318" width="22" height="108" rx="11"/>
    <rect x="146" y="332" width="22" height="80"  rx="11"/>
    <rect x="184" y="300" width="22" height="144" rx="11"/>
    <rect x="222" y="322" width="22" height="100" rx="11"/>
    <rect x="260" y="292" width="22" height="160" rx="11"/>
    <rect x="298" y="326" width="22" height="92"  rx="11"/>
    <rect x="336" y="306" width="22" height="132" rx="11"/>
    <rect x="374" y="334" width="22" height="76"  rx="11"/>
    <rect x="412" y="322" width="22" height="100" rx="11"/>
  </g>

  <!-- Sent out: a point with its signal around it -->
  <g fill="none" stroke="#34C47C" stroke-linecap="round" stroke-width="20">
    <path d="M 196 214 A 84 84 0 0 1 196 98" opacity="0.95"/>
    <path d="M 316 98 A 84 84 0 0 1 316 214" opacity="0.95"/>
    <path d="M 160 250 A 136 136 0 0 1 160 62" opacity="0.6"/>
    <path d="M 352 62 A 136 136 0 0 1 352 250" opacity="0.6"/>
  </g>
  <circle cx="256" cy="156" r="66" fill="#34C47C" opacity="0.16"/>
  <circle cx="256" cy="156" r="40" fill="url(#light)"/>
  <circle cx="256" cy="156" r="40" fill="none" stroke="#B9F7D6" stroke-width="4" opacity="0.6"/>
</svg>
