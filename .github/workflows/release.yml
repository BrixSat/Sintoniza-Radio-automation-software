# Builds the Windows and Linux packages with build.sh and publishes them as a GitHub Release.
# Triggered by pushing a version tag:  git tag v1.0.0 && git push origin v1.0.0
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y nsis fakeroot

      - name: Build packages
        run: ./build.sh all "${GITHUB_REF_NAME#v}"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/*-setup.exe dist/*.zip dist/*.deb dist/*.tar.gz \
            --title "Radio Playout $GITHUB_REF_NAME" --generate-notes
